volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha:
    driver: bridge

services:
  lb:
    build:
      context: .
      dockerfile: Dockerfile.lb
    container_name: rinha-lb
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"

  api1:
    #image: hisraelbraga/hisrael-rinha-rust-2026:initial
    build:
      context: .
      args:
        FEATURES: ${FEATURES:-}
    environment:
      - PORT=8080
      - INSTANCE_ID=1
      - OMP_NUM_THREADS=1
    volumes:
      - sockets:/tmp/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"

  api2:
    #image: hisraelbraga/hisrael-rinha-rust-2026:initial
    build:
      context: .
      args:
        FEATURES: ${FEATURES:-}
    environment:
      - PORT=8080
      - INSTANCE_ID=2
      - OMP_NUM_THREADS=1
    volumes:
      - sockets:/tmp/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"
