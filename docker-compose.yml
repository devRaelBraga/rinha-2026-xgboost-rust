volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"

services:

  lb:
    image: hisraelbraga/hisrael-lb-rust:v1
    container_name: rinha-lb
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - apparmor:unconfined
    cpuset: "2,3"
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"

  api1:
    image: hisraelbraga/hisrael-rinha-rust-2026-knn:v3.7
    environment:
      - PORT=8080
      - INSTANCE_ID=1
    volumes:
      - sockets:/tmp/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - apparmor:unconfined
    cpuset: "0"
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"

  api2:
    image: hisraelbraga/hisrael-rinha-rust-2026-knn:v3.7
    environment:
      - PORT=8080
      - INSTANCE_ID=2
    volumes:
      - sockets:/tmp/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - apparmor:unconfined
    cpuset: "1"
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"
